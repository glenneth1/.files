#
# weechat -- buflist.conf
#
# WARNING: It is NOT recommended to edit this file by hand,
# especially if WeeChat is running.
#
# Use commands like /set or /fset to change settings in WeeChat.
#
# For more info, see: https://weechat.org/doc/weechat/quickstart/
#

[look]
add_newline = on
auto_scroll = 50
display_conditions = "${buffer.hidden}==0"
enabled = on
mouse_jump_visited_buffer = off
mouse_move_buffer = on
mouse_wheel = on
nick_prefix = off
nick_prefix_empty = on
signals_refresh = ""
sort = "irc_server.name,irc_channel.type,~name"
use_items = 1

[format]
buffer = "${format_number}${indent}${format_nick_prefix}${color_hotlist}${if:${type}==server?${color:31} }${if:${type}==channel?${color:109} }${if:${type}==private?${color:175} }${if:${hotlist}?${color_hotlist}}${format_name}"
buffer_current = "${color:236,73} ${format_buffer} "
hotlist = " ${color:green}${hotlist}"
hotlist_highlight = "${color:178}"
hotlist_low = "${color:240}"
hotlist_message = "${color:37}"
hotlist_none = "${color:240}"
hotlist_private = "${color:34}"
hotlist_separator = "${color:238},"
indent = "${color:237}│ "
lag = " ${color:34}[${color:178}${lag}${color:34}]"
name = "${name}"
nick_prefix = "${color_nick_prefix}${nick_prefix}"
number = "${color:34}${number}${if:${number_displayed}?.: }"
tls_version = ""
