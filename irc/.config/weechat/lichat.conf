[behaviour]
backfill_timeout = 1000
backfill_window_count = 255
backfill_window_time = 30
data_save_directory = "/home/glenn/.local/share/weechat/lichat/downloads/"
data_save_types = "all"
highlight = ""
imgur_client_id = ""
logfile = off
loglevel = WARNING
logtraceback = off

[server_default]
autoconnect = off
autojoin = ""
autoreconnect = off
autoreconnect_delay = 60
highlight = "username"
host = ""
name = ""
password = ""
port = 1111
ssl = off
username = "${username}"

[server]
tynet.autoconnect = off
tynet.autojoin = "lichatters"
tynet.autoreconnect = off
tynet.autoreconnect_delay = 60
tynet.highlight = "username"
tynet.host = "chat.tymoon.eu"
tynet.name = "TyNET"
tynet.password = "b3l0wz3r0"
tynet.port = 1112
tynet.ssl = on
tynet.username = "glenneth"
