# open-actions.conf - what kitty does when you click a link.
# Loaded automatically by kitty. Inside a mouse-using app like WeeChat,
# hold ctrl+shift while clicking the link so kitty (not the app) handles it.
#
# Image links: download and preview inline in an overlay window via icat.
# Everything else falls through to kitty's default (opens in your browser).

# https image links
protocol https
ext jpg,jpeg,png,gif,webp,bmp,tiff,tif,ico
action launch --type=overlay ~/.config/kitty/preview-url.sh ${URL}

# http image links
protocol http
ext jpg,jpeg,png,gif,webp,bmp,tiff,tif,ico
action launch --type=overlay ~/.config/kitty/preview-url.sh ${URL}
